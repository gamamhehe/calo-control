@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap');
.app{
  --bg:#E6EAED; --surface:#FFFFFF; --ink:#15232D; --muted:#5B6B77; --rule:#CAD2D8;
  --prot:#0E7565; --fat:#86408C; --carb:#B8730F; --fruit:#4E7F1F; --action:#1E3CB8; --warn:#B4322A; --chip:#EEF2F4;
  background:var(--bg); color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app .muted{color:var(--muted)}
.app .num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.app button:focus-visible,.app select:focus-visible,.app input:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.app .tab{padding:.3rem .6rem;border-radius:999px;color:var(--muted)}
.app .tab-on{background:var(--ink);color:#fff}
.app .link{color:var(--action);text-decoration:underline}
.app .seg{display:flex;background:#D7DDE2;border-radius:10px;padding:3px}
.app .seg-btn{flex:1;padding:.45rem 0;border-radius:8px;font-size:.8125rem;color:var(--muted);font-weight:500}
.app .seg-on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(21,35,45,.18)}
.app .weight{background:var(--surface);border-radius:10px;padding:.25rem .5rem;border:1px solid var(--rule)}
.app .weight-input{width:3.2rem;font-size:1.25rem;background:transparent;text-align:right;border:0;outline-offset:4px}
.app .summary{background:rgba(230,234,237,.94);backdrop-filter:blur(8px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.app .chip,.app .chip-select{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:.35rem .6rem;font-size:.8125rem;color:var(--ink)}
.app .chip-select{max-width:100%}
.app .hint{background:#FFF6E0;border-left:3px solid var(--carb);padding:.6rem .75rem;border-radius:4px}
.app .hint p+p{margin-top:.35rem}
.app .meal{display:grid;grid-template-columns:3.1rem 1fr;gap:.5rem;padding-top:1rem}
.app .meal-rail{border-right:2px solid var(--rule);padding-right:.4rem;text-align:right;padding-top:.05rem;color:var(--muted)}
.app .meal-body{min-width:0}
.app .item-row{border-bottom:1px solid var(--rule)}
.app .food-select{background:transparent;font-size:.9375rem;font-weight:500;color:var(--ink);padding:0;border:0;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.app .readout{background:var(--chip);border-radius:8px;padding:.15rem .45rem;box-shadow:inset 0 1px 3px rgba(21,35,45,.22);border:1px solid #D3DAE0}
.app .readout-input{width:3.3rem;font-size:1.65rem;line-height:1.1;background:transparent;text-align:right;border:0;color:var(--ink)}
.app .icon-btn{width:2.1rem;height:2.1rem;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.app .icon-btn.locked{color:var(--action);background:#E3E8F8}
.app .cat-btn{display:inline-flex;align-items:center;gap:.2rem;font-size:.8125rem;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:.3rem .65rem .3rem .5rem}
.app .cat-btn:active{background:var(--chip)}
.app .cat-dot{display:inline-block;width:.55rem;height:.55rem;border-radius:999px;margin-right:.4rem;vertical-align:.08rem}
.app .eaten-btn{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:.15rem .55rem}
.app .eaten-on{color:#fff;background:var(--prot);border:1px solid var(--prot)}
.app .meal-eaten .item-row{opacity:.62}
.app .sheet-backdrop{background:rgba(21,35,45,.35)}
.app .sheet{background:var(--bg);border-radius:16px 16px 0 0;max-height:78vh;overflow-y:auto;box-shadow:0 -4px 18px rgba(21,35,45,.2);padding-bottom:max(.5rem,env(safe-area-inset-bottom));animation:sheetUp .22s ease-out}
.app .food-pick{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.55rem .65rem;min-height:3.4rem}
.app .food-pick:active{background:var(--chip)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.app .sheet{animation:none}}
.app .bottom-bar{background:linear-gradient(to top,var(--bg) 75%,rgba(230,234,237,0));padding-bottom:max(.25rem,env(safe-area-inset-bottom))}
.app .primary{background:var(--action);color:#fff;font-weight:600;border-radius:12px;padding:.85rem 1rem;font-size:1rem;box-shadow:0 2px 6px rgba(30,60,184,.35)}
.app .primary:disabled{opacity:.45;box-shadow:none}
.app .btn-ghost{color:var(--action);padding:.3rem 0}
.app .field{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:.35rem .5rem;font-size:1rem;color:var(--ink)}
.app .rule-b{border-bottom:1px solid var(--rule)}
@keyframes weighIn{0%{background:#FFE7A3}100%{background:var(--chip)}}
.app .flash{animation:weighIn .9s ease-out}
@media (prefers-reduced-motion:reduce){.app .flash{animation:none}.app *{transition:none!important}}
